<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
display:flex;justify-content:center;align-items:center;
min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);
padding:20px;
}
.chat-container{
width:100%;max-width:700px;height:85vh;
background:white;border-radius:24px;overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.2);
display:flex;flex-direction:column;
}
.header{padding:20px;background:#111827;color:white;font-size:1.2rem;font-weight:600}
.messages{flex:1;padding:20px;overflow-y:auto;background:#f9fafb}
.message{max-width:80%;padding:14px 18px;margin:10px 0;border-radius:18px;line-height:1.5}
.user{margin-left:auto;background:#4f46e5;color:white}
.bot{background:#e5e7eb;color:#111827}
.input-area{display:flex;padding:16px;background:white;border-top:1px solid #eee}
input{
flex:1;padding:14px;border:1px solid #ddd;border-radius:14px;
font-size:16px;outline:none
}
button{
margin-left:10px;padding:14px 22px;border:none;
border-radius:14px;background:#4f46e5;color:white;
cursor:pointer;font-weight:600
}
.typing{display:flex;gap:4px;padding:14px 18px;background:#e5e7eb;border-radius:18px;width:fit-content}
.dot{width:8px;height:8px;background:#6b7280;border-radius:50%;animation:bounce 1.4s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@media(max-width:768px){.chat-container{height:100vh;border-radius:0}}
</style>
</head>
<body>
<div class="chat-container">
<div class="header">Agent IA</div>
<div class="messages" id="messages"></div>
<div class="input-area">
<input id="input" placeholder="Tapez votre message...">
<button onclick="sendMessage()">Envoyer</button>
</div>
</div>
<script>
const WEBHOOK_URL='https://hook.eu2.make.com/3dqthsoseqtq2kgto3mv1aimq9ht5iay';
const messages=document.getElementById('messages');
const input=document.getElementById('input');

function addMessage(text,type){
const div=document.createElement('div');
div.className=`message ${type}`;
div.textContent=text;
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
return div;
}

function showTyping(){
const div=document.createElement('div');
div.className='typing';div.id='typing';
div.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}

function removeTyping(){const t=document.getElementById('typing');if(t)t.remove();}

async function sendMessage(){
const text=input.value.trim();if(!text)return;
addMessage(text,'user');input.value='';showTyping();
try{
const res=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
const data=await res.json();
removeTyping();
addMessage(data.reply||data.response||'Aucune réponse','bot');
}catch(e){removeTyping();addMessage('Erreur de connexion au webhook','bot');}
}

input.addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage();});
</script>
</body>
</html>
